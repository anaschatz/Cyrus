[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice"
version = "0.7.0"
description = "Local-first JARVIS voice interface"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1"]
audio = ["sounddevice==0.5.3", "soxr==1.1.0"]
vad = ["onnxruntime==1.27.0"]
transport = ["websockets>=15,<16"]
windows = ["pywin32>=311"]
macos = ["sounddevice==0.5.3", "soxr==1.1.0", "onnxruntime==1.27.0", "websockets>=15,<16"]
macos-cpu-smoke = ["faster-whisper==1.2.1", "sounddevice==0.5.3", "soxr==1.1.0", "onnxruntime==1.27.0", "websockets>=15,<16"]
packaging = ["pyinstaller==6.21.0"]
dev = []

[project.scripts]
jarvis-voice = "jarvis_voice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
