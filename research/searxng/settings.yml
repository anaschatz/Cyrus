use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: true
  image_proxy: false
  method: "POST"

search:
  formats:
    - json
  safe_search: 1
  autocomplete: ""

outgoing:
  request_timeout: 3.0
  max_request_timeout: 3.0
  pool_connections: 16
  pool_maxsize: 16
  enable_http2: false
  retries: 0
  proxies:
    all://:
      - http://searx-egress-auth:8081

ui:
  static_use_hash: true

enabled_plugins:
  - "Hash plugin"
