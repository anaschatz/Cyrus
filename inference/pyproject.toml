[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-inference"
version = "1.0.0"
description = "Stateless, fail-closed local inference appliance for CYRUS"
requires-python = ">=3.11"
dependencies = []
license-files = []

[project.optional-dependencies]
qualification = ["openai==2.46.0"]
mlx = ["mlx-lm==0.31.3", "outlines==1.3.2"]
test = []

[project.scripts]
cyrus-inference = "jarvis_inference.cli:main"
cyrus-qwen35-sampling-candidate = "jarvis_inference.qwen35_sampling_candidate:main"
# Compatibility aliases retained for qualified appliance bundles.
jarvis-inference = "jarvis_inference.cli:main"
jarvis-qwen35-sampling-candidate = "jarvis_inference.qwen35_sampling_candidate:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis_inference"]
namespaces = false
