[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-inference"
version = "1.0.0"
description = "Stateless, fail-closed local inference appliance for JARVIS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qualification = ["openai==2.46.0"]
mlx = ["mlx-lm==0.31.3", "outlines==1.3.2"]
test = []

[project.scripts]
jarvis-inference = "jarvis_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
