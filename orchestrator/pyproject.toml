[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-orchestrator"
version = "1.0.0"
description = "Durable local-first JARVIS orchestration core"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography==49.0.0",
  "pydantic-ai-slim[openai]==2.27.0",
  "tzdata==2026.3",
  "websockets>=15,<16",
  "httpx>=0.27,<1",
]

[project.scripts]
jarvis-orchestrator = "jarvis_orchestrator.cli:main"
jarvis-action-host = "jarvis_orchestrator.action_host_daemon:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
