[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-orchestrator"
version = "1.0.0"
description = "Durable local-first JARVIS orchestration core"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anamnesis-memory-eval==0.1.0",
  "cryptography==49.0.0",
  "pydantic-ai-slim[openai]==2.27.0",
  "tzdata==2026.3",
  "websockets>=15,<16",
  "httpx>=0.27,<1",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
jarvis-orchestrator = "jarvis_orchestrator.cli:main"
jarvis-action-host = "jarvis_orchestrator.action_host_daemon:main"
jarvis-stack = "jarvis_orchestrator.stack_cli:main"

[dependency-groups]
dev = [
  "jarvis-research==1.0.0",
]

[tool.uv.sources]
anamnesis-memory-eval = { path = "../anamnesis" }
jarvis-research = { path = "../research" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
